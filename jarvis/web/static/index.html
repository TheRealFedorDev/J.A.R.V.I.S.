<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berta</title>
  <link rel="stylesheet" href="/static/style.css?v=20260929g">
  <link rel="stylesheet" href="/static/hud.css?v=20260929g">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
  <!-- ══════════ ФОН: рамка, сетка, скан-линии, виньетка ══════════ -->
  <div class="hud-frame" aria-hidden="true">
    <i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i>
    <div class="hud-grid"></div>
    <div class="hud-scan"></div>
    <div class="hud-vignette"></div>
  </div>

  <!-- ══════════ ЦЕНТР: орб + кольца активностей ══════════ -->
  <main class="center-stage">
    <div class="orb-stage">
      <!-- декор: медленное внешнее кольцо, быстрое среднее, пульсирующее внутреннее -->
      <div class="reactor" aria-hidden="true">
        <i class="ring r1"></i>
        <i class="ring r2"></i>
        <i class="ring r3"></i>
      </div>

      <!-- кольца активностей: загораются по body[data-orb-state] -->
      <div class="act-rings" aria-hidden="true">
        <span class="act" data-act="stt"><b>слушаю</b></span>
        <span class="act" data-act="search"><b>поиск</b></span>
        <span class="act" data-act="llm"><b>думаю</b></span>
        <span class="act" data-act="tts"><b>говорю</b></span>
      </div>

      <div id="ai-orb" class="orb-float"></div>
    </div>

    <!-- единственная полоса: что она делает сейчас -->
    <div class="statusbar">
      <div class="status-pill" id="statusPill" data-state="boot">
        <span class="dot"></span>
        <span id="statusText">Запуск…</span>
      </div>
    </div>
  </main>

  <!-- ══════════ ЭКСТРЕННАЯ ОСТАНОВКА ══════════ -->
  <button class="emergency" id="emergencyBtn" title="Экстренная остановка">
    <span>СТОП</span>
  </button>

  <!-- ══════════ ЗАДАЧИ ══════════ -->
  <button class="task-toggle" id="taskToggleBtn" aria-expanded="false"
          aria-controls="taskPanel" title="Список задач">
    <span>ЗАДАЧИ</span>
  </button>

  <section class="task-panel" id="taskPanel" aria-label="Задачи" hidden>
    <header class="task-head">
      <span class="task-title">Задачи</span>
      <span class="task-count" id="taskCount">0</span>
      <button class="task-close" id="taskCloseBtn" title="Свернуть"
              aria-label="Свернуть">×</button>
    </header>

    <ol class="task-list" id="taskList"></ol>
    <p class="task-empty" id="taskEmpty">Пока пусто. Скажите
      «Берта, добавь задачу …» или впишите ниже.</p>

    <form class="task-form" id="taskForm">
      <input class="task-input" id="taskInput" type="text" maxlength="500"
             placeholder="Новая задача" autocomplete="off">
      <button class="task-submit" type="submit">Добавить</button>
    </form>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/app.js?v=20261008b"></script>
  <script src="/static/orb.js?v=20261008b"></script>
</body>
</html>
